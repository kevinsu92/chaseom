<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Segoe UI, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <title>Chaseom architecture: car signals to adapters to a pure domain to Compose UI</title>
  <rect width="1200" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
    <style>
      .lane{font-size:15px;font-weight:700;fill:#5b6470;letter-spacing:.5px}
      .t{font-size:16px;font-weight:700;fill:#131417}
      .s{font-size:13px;fill:#3d434b}
      .n{font-size:12px;fill:#6b7280}
      .ln{stroke:#5b6470;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>

  <!-- lanes -->
  <text class="lane" x="40" y="40">CAR (Pleos Connect)</text>
  <text class="lane" x="300" y="40">ADAPTERS  ·  only place with SDK types</text>
  <text class="lane" x="640" y="40">DOMAIN  ·  pure Kotlin, JVM unit tests</text>
  <text class="lane" x="980" y="40">UI  ·  Jetpack Compose</text>
  <line x1="270" y1="55" x2="270" y2="520" stroke="#e3e6ea" stroke-width="2"/>
  <line x1="610" y1="55" x2="610" y2="520" stroke="#e3e6ea" stroke-width="2"/>
  <line x1="950" y1="55" x2="950" y2="520" stroke="#e3e6ea" stroke-width="2"/>

  <!-- car -->
  <rect x="30" y="70" width="220" height="92" rx="12" fill="#eef1f5" stroke="#c9d0d8"/>
  <text class="t" x="44" y="98">Pleos Vehicle SDK 2.3.2</text>
  <text class="s" x="44" y="120">EvBattery · HVAC · Seat</text>
  <text class="s" x="44" y="140">Door · Window · Light</text>
  <rect x="30" y="180" width="220" height="92" rx="12" fill="#eef1f5" stroke="#c9d0d8"/>
  <text class="t" x="44" y="208" style="font-size:15px">AAOS CarPropertyManager</text>
  <text class="s" x="44" y="230">GEAR_SELECTION · fuel type</text>
  <text class="s" x="44" y="250">battery capacity · charge port</text>
  <rect x="30" y="290" width="220" height="72" rx="12" fill="#eef1f5" stroke="#c9d0d8"/>
  <text class="t" x="44" y="318">CarUxRestrictions</text>
  <text class="s" x="44" y="340">driving restriction</text>
  <text class="n" x="30" y="396">Read only. No control permission,</text>
  <text class="n" x="30" y="414">no runtime permission dialog.</text>

  <!-- adapters -->
  <rect x="290" y="70" width="300" height="92" rx="12" fill="#fff7e6" stroke="#f0c36d"/>
  <text class="t" x="304" y="98">PleosCabinRepository</text>
  <text class="s" x="304" y="120">listeners + 1 s polling (P only)</text>
  <text class="s" x="304" y="140">SDK error → value null (= unknown)</text>
  <rect x="290" y="180" width="300" height="92" rx="12" fill="#fff7e6" stroke="#f0c36d"/>
  <text class="t" x="304" y="208">PleosVehicleRepository</text>
  <text class="s" x="304" y="230">gear from GEAR_SELECTION, SOC</text>
  <text class="s" x="304" y="250">no private getGear()</text>
  <rect x="290" y="290" width="300" height="72" rx="12" fill="#fff7e6" stroke="#f0c36d"/>
  <text class="t" x="304" y="318">CarUxRestrictionSource</text>
  <text class="s" x="304" y="340">→ DrivingStateGate (P / not P)</text>
  <rect x="290" y="390" width="300" height="70" rx="12" fill="#ffffff" stroke="#c9d0d8" stroke-dasharray="5 4"/>
  <text class="t" x="304" y="418">CabinState · VehicleSnapshot</text>
  <text class="s" x="304" y="440">immutable StateFlow values</text>

  <!-- domain -->
  <rect x="630" y="70" width="300" height="110" rx="12" fill="#e9f6ee" stroke="#8fd0a6"/>
  <text class="t" x="644" y="98">StayEngine</text>
  <text class="s" x="644" y="120">update(signals, settings, time) → StayUi</text>
  <text class="s" x="644" y="140">notices N0–N3 · toast · exchange</text>
  <text class="s" x="644" y="160">receipt · restore rule · monotonic clock</text>
  <rect x="630" y="196" width="145" height="96" rx="12" fill="#e9f6ee" stroke="#8fd0a6"/>
  <text class="t" x="644" y="224">EnergyModel</text>
  <text class="s" x="644" y="246">sourced kW table</text>
  <text class="s" x="644" y="266">minutes to keep</text>
  <rect x="785" y="196" width="145" height="96" rx="12" fill="#e9f6ee" stroke="#8fd0a6"/>
  <text class="t" x="799" y="224">Island · IslandInfo</text>
  <text class="s" x="799" y="246">signal → picture</text>
  <text class="s" x="799" y="266">steps, 1 meaning each</text>
  <rect x="630" y="310" width="300" height="72" rx="12" fill="#ffffff" stroke="#8fd0a6" stroke-dasharray="5 4"/>
  <text class="t" x="644" y="338">StayUi</text>
  <text class="s" x="644" y="360">immutable screen model (no strings)</text>
  <rect x="630" y="400" width="300" height="100" rx="12" fill="#f3f4f6" stroke="#c9d0d8"/>
  <text class="t" x="644" y="428">StayController (Android glue)</text>
  <text class="s" x="644" y="450">runs StayEngine on Main · local prefs</text>
  <text class="s" x="644" y="470">StayService: foreground only while</text>
  <text class="s" x="644" y="490">staying in P, stops when not P</text>

  <!-- ui -->
  <rect x="970" y="70" width="200" height="92" rx="12" fill="#eaf0ff" stroke="#9db4f0"/>
  <text class="t" x="984" y="98">SceneHost</text>
  <text class="s" x="984" y="120">P → stay scene</text>
  <text class="s" x="984" y="140">not P → fold at once</text>
  <rect x="970" y="180" width="200" height="112" rx="12" fill="#eaf0ff" stroke="#9db4f0"/>
  <text class="t" x="984" y="208">StayScenes · IslandView</text>
  <text class="s" x="984" y="230">hero "(추정)", toast,</text>
  <text class="s" x="984" y="250">cards, receipt, island</text>
  <text class="s" x="984" y="270">strings_stay.xml only</text>
  <rect x="970" y="310" width="200" height="72" rx="12" fill="#ffffff" stroke="#9db4f0" stroke-dasharray="5 4"/>
  <text class="t" x="984" y="338">StayActions</text>
  <text class="s" x="984" y="360">user taps → controller</text>

  <!-- arrows -->
  <path class="ln" d="M250,116 H288"/>
  <path class="ln" d="M250,226 H288"/>
  <path class="ln" d="M250,326 H288"/>
  <path class="ln" d="M440,362 V388"/>
  <path class="ln" d="M590,425 H628"/>
  <path class="ln" d="M780,400 V384"/>
  <path class="ln" d="M930,340 C950,340 950,236 968,236"/>
  <path class="ln" d="M1070,292 V308"/>
  <path class="ln" d="M1070,382 C1070,520 960,520 932,470"/>

  <text class="n" x="30" y="545">Dependency direction: UI → domain ← adapters. Domain files import no android.*, android.car.* or ai.pleos.* (StayController / StayService are the Android glue).</text>
</svg>
