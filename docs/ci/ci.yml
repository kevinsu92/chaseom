# To enable: copy this file to .github/workflows/ci.yml (pushing workflow files needs a token with the
# `workflow` scope). Runs the unit tests on every push and pull request.
# Unit tests on every push and pull request. Runs without an emulator (JVM tests, about 1 minute).
# The Pleos Playground Maven repository is public, so the build needs no secrets.
# The release keystore is never used here; CI builds debug only.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
      - name: Test report summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          rows = []
          for p in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              s = ET.parse(p).getroot()
              n, bad = int(s.get("tests")), int(s.get("failures")) + int(s.get("errors"))
              t += n; f += bad
              rows.append(f"| {s.get('name').split('.')[-1]} | {n} | {bad} |")
          print(f"### Unit tests: {t - f}/{t} passed\n\n| suite | tests | failed |\n|---|---|---|")
          print("\n".join(rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
