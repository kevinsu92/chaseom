org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- App identity & versioning (edit once the idea is locked) ----
# App name: 차섬 (Chaseom). File is read as UTF-8 by app/build.gradle.kts.
# release.appName -> release APK name apk/<appName>_<appName>_release.apk (no team
#                    name, no real name; the app name fills the team slot).
# app.label       -> launcher label (app_name resource).
release.appName=Chaseom
app.label=차섬
app.versionCode=14
app.versionName=1.3.0
